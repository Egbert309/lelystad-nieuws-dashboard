name: Lelystad Nieuws – Dashboard Update

on:
  schedule:
    - cron: '23 3 * * *'   # dagelijks vangnet (UTC); uurlijkse trigger via Hermes
  workflow_dispatch:        # handmatig starten via GitHub UI

concurrency:
  group: fetch-news       # nooit twee runs tegelijk (bv. herhaalde dispatch door Hermes)
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # nodig om data/news.json te committen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Afhankelijkheden installeren
        run: pip install feedparser

      - name: Nieuws ophalen en JSON opslaan
        run: python fetch_news.py

      - name: JSON committen naar repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || git commit -m "chore: update news data [skip ci]"
          # push opnieuw proberen bij tijdelijke GitHub-fout of als main intussen is gewijzigd
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            echo "::warning::git push mislukt (poging $i), opnieuw na $((i * 10)) s"
            sleep $((i * 10))
            git pull --rebase -X theirs origin main || { git rebase --abort || true; }
          done
          [ "$ok" = 1 ]
