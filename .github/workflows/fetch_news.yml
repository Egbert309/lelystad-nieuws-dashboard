name: Lelystad Nieuws – Dashboard Update

on:
  schedule:
    - cron: '0 * * * *'   # elk uur, elke dag
  workflow_dispatch:        # handmatig starten via GitHub UI

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # nodig om data/news.json te committen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Afhankelijkheden installeren
        run: pip install feedparser

      - name: Nieuws ophalen en JSON opslaan
        run: python fetch_news.py

      - name: JSON committen naar repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || git commit -m "chore: update news data [skip ci]"
          git push
