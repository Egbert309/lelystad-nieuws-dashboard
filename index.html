<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lelystad Nieuws Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
      --accent: #4f8ef7; --text: #e4e6f0; --muted: #7b7f99;
      --red: #e05c5c; --radius: 10px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; position: sticky; top: 0; z-index: 10; }
    .header-left h1 { font-size: 1.25rem; font-weight: 700; }
    .header-left h1 span { color: var(--accent); }
    .header-meta { font-size: .78rem; color: var(--muted); margin-top: 3px; }
    .header-meta #last-updated { color: var(--text); font-weight: 500; }
    .header-right { display: flex; align-items: center; gap: 14px; }
    .countdown { font-size: .8rem; color: var(--muted); white-space: nowrap; }
    .countdown span { color: var(--accent); font-weight: 600; }
    #refresh-btn { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 7px 16px; font-size: .85rem; font-weight: 600; cursor: pointer; transition: opacity .15s; white-space: nowrap; }
    #refresh-btn:hover { opacity: .85; }
    #refresh-btn:disabled { opacity: .45; cursor: default; }
    #status-bar { font-size: .8rem; padding: 7px 24px; background: #1c1f2e; border-bottom: 1px solid var(--border); color: var(--muted); display: none; }
    #status-bar.error { color: var(--red); display: block; }
    #status-bar.loading { color: var(--accent); display: block; }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 24px; max-width: 1600px; margin: 0 auto; }
    .source-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
    .card-header { padding: 13px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .card-title { font-weight: 700; font-size: .95rem; display: flex; align-items: center; gap: 8px; }
    .card-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .badge { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--border); color: var(--muted); }
    .badge.has-items { background: #1a2d4a; color: var(--accent); }
    .card-items { list-style: none; flex: 1; overflow-y: auto; max-height: 420px; }
    .card-items li { border-bottom: 1px solid var(--border); }
    .card-items li:last-child { border-bottom: none; }
    .item-link { display: block; padding: 12px 16px; text-decoration: none; color: var(--text); transition: background .1s; }
    .item-link:hover { background: #21253a; }
    .item-title { font-size: .875rem; font-weight: 500; line-height: 1.4; margin-bottom: 4px; }
    .item-meta { font-size: .74rem; color: var(--muted); }
    .item-summary { font-size: .78rem; color: var(--muted); margin-top: 5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .empty-state { padding: 28px 16px; text-align: center; color: var(--muted); font-size: .85rem; }
    .skeleton { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .skel-line { height: 12px; border-radius: 4px; background: linear-gradient(90deg, var(--border) 25%, #2e3247 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; margin-bottom: 7px; }
    .skel-line.short { width: 55%; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    @media (max-width: 600px) { main { padding: 14px; gap: 14px; } header { padding: 12px 14px; } }
  </style>
</head>
<body>
<header>
  <div class="header-left">
    <h1>Lelystad <span>Nieuws</span> Dashboard</h1>
    <div class="header-meta">Bijgewerkt: <span id="last-updated">laden…</span></div>
  </div>
  <div class="header-right">
    <div class="countdown">Volgende verversing: <span id="countdown">60:00</span></div>
    <button id="refresh-btn" onclick="loadNews(true)">&#8635; Verversen</button>
  </div>
</header>
<div id="status-bar"></div>
<main id="grid"></main>
<script>
  const SOURCES = [
    { name: "Radio Lelystad",   color: "#e87f3a" },
    { name: "Omroep Flevoland", color: "#4f8ef7" },
    { name: "De Stentor",       color: "#3ecf8e" },
    { name: "Nu.nl",            color: "#e05c5c" },
    { name: "NOS",              color: "#c97bdb" },
  ];
  const REFRESH_INTERVAL_MS = 60 * 60 * 1000;
  const JSON_PATH = "data/news.json";
  let countdownSec = REFRESH_INTERVAL_MS / 1000;
  let countdownTimer = null, autoRefreshTimer = null;

  function setStatus(msg, type) {
    const bar = document.getElementById("status-bar");
    bar.textContent = msg; bar.className = type || "";
  }
  function fmt(iso) {
    if (!iso) return "–";
    try { return new Intl.DateTimeFormat("nl-NL", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit", timeZone:"Europe/Amsterdam" }).format(new Date(iso)); }
    catch { return iso; }
  }
  function fmtCountdown(sec) {
    return String(Math.floor(sec/60)).padStart(2,"0") + ":" + String(sec%60).padStart(2,"0");
  }
  function renderSkeletons() {
    const grid = document.getElementById("grid"); grid.innerHTML = "";
    SOURCES.forEach(src => {
      const card = document.createElement("div"); card.className = "source-card";
      card.innerHTML = '<div class="card-header"><div class="card-title"><span class="card-dot" style="background:' + src.color + '"></span>' + src.name + '</div><span class="badge">–</span></div><ul class="card-items"><li class="skeleton"><div class="skel-line"></div><div class="skel-line short"></div></li><li class="skeleton"><div class="skel-line"></div><div class="skel-line short"></div></li></ul>';
      grid.appendChild(card);
    });
  }
  function renderData(data) {
    const grid = document.getElementById("grid"); grid.innerHTML = "";
    document.getElementById("last-updated").textContent = data.updated ? fmt(data.updated) : "onbekend";
    SOURCES.forEach(src => {
      const items = (data.sources || {})[src.name] || [];
      const card = document.createElement("div"); card.className = "source-card";
      const bc = items.length > 0 ? "badge has-items" : "badge";
      const list = items.length === 0
        ? '<li class="empty-state">Geen Lelystad-nieuws gevonden</li>'
        : items.map(it => '<li><a class="item-link" href="' + it.link + '" target="_blank" rel="noopener"><div class="item-title">' + it.title + '</div><div class="item-meta">' + fmt(it.published) + '</div>' + (it.summary ? '<div class="item-summary">' + it.summary + '</div>' : '') + '</a></li>').join("");
      card.innerHTML = '<div class="card-header"><div class="card-title"><span class="card-dot" style="background:' + src.color + '"></span>' + src.name + '</div><span class="' + bc + '">' + items.length + '</span></div><ul class="card-items">' + list + '</ul>';
      grid.appendChild(card);
    });
  }
  async function loadNews(manual) {
    const btn = document.getElementById("refresh-btn"); btn.disabled = true;
    if (manual) setStatus("Nieuws ophalen…", "loading");
    try {
      const r = await fetch(JSON_PATH + "?t=" + Date.now());
      if (!r.ok) throw new Error("HTTP " + r.status);
      renderData(await r.json()); setStatus("", "");
    } catch(e) { setStatus("Fout bij laden: " + e.message, "error"); }
    finally { btn.disabled = false; resetCountdown(); }
  }
  function resetCountdown() {
    countdownSec = REFRESH_INTERVAL_MS / 1000;
    clearInterval(countdownTimer); clearTimeout(autoRefreshTimer);
    countdownTimer = setInterval(() => { countdownSec = Math.max(0, countdownSec-1); document.getElementById("countdown").textContent = fmtCountdown(countdownSec); }, 1000);
    autoRefreshTimer = setTimeout(() => loadNews(false), REFRESH_INTERVAL_MS);
  }
  renderSkeletons();
  loadNews(false);
</script>
</body>
</html>
